name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rydo
          POSTGRES_PASSWORD: rydo
          POSTGRES_DB: rydo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rydo" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: services/api
      - run: npm run build -w @rydo/shared -w @rydo/ui-tokens
      - name: Typecheck all apps
        run: npm run typecheck
      - name: API tests (auth, tenant isolation, roles)
        run: npm test -w @rydo/api