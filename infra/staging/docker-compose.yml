# RYDO staging: one server, everything in Docker, HTTPS by Caddy.
#   cp infra/staging/.env.staging.example infra/staging/.env   (fill it in)
#   docker compose -f infra/staging/docker-compose.yml --env-file infra/staging/.env up -d --build
# Guide: docs/deploy/staging.md
name: rydo-staging

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379
  TRUST_PROXY: "true"
  WEB_ORIGIN: https://${DOMAIN}
  JWT_SECRET: ${JWT_SECRET}
  OTP_PEPPER: ${OTP_PEPPER}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASS: ${SMTP_PASS}
  MAIL_FROM: ${MAIL_FROM}
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET}
  GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
  JOBS_ENABLED: "true"
  SEED_SUPER_ADMIN_EMAIL: ${SEED_SUPER_ADMIN_EMAIL}
  SEED_DEV_PASSWORD: ${SEED_DEV_PASSWORD}

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Driver documents. Reached by browsers through Caddy at https://files.<domain> (signed links only).
  storage:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_REGION: ${S3_REGION}
    volumes: [storage-data:/data]

  # Runs database migrations once, then exits. The API starts only after it succeeds.
  migrate:
    build: { context: ../.., dockerfile: services/api/Dockerfile, target: build }
    environment: *api-env
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  api:
    build: { context: ../.., dockerfile: services/api/Dockerfile }
    image: rydo-api:staging
    restart: unless-stopped
    environment: *api-env
    deploy: { replicas: 2 }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY}
        NEXT_PUBLIC_GOOGLE_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAP_ID:-}
        NEXT_PUBLIC_REALTIME_URL: ""
        API_URL: http://api:4000
    image: rydo-web:staging
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data, caddy-config:/config]
    depends_on: [web, api]

  # Nightly database backup (02:30 server time), kept BACKUP_KEEP_DAYS days in ./backups. Copy them off the server too.
  backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes: [./backup.sh:/backup.sh:ro, ./restore.sh:/restore.sh:ro, ./backups:/backups]
    entrypoint: ["/bin/sh", "-c", "while true; do now=$$(date +%s); next=$$(date -d 'tomorrow 02:30' +%s 2>/dev/null || echo $$((now + 86400))); sleep $$((next - now)); /bin/sh /backup.sh; done"]
    depends_on: { db: { condition: service_healthy } }

volumes:
  db-data:
  storage-data:
  caddy-data:
  caddy-config: